<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<title>Studio – Instruments</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a5a;--pill:rgba(255,255,255,.9);--line:rgba(59,42,90,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;overflow:hidden;background:#fff1d6;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--ink);background:var(--pill);border:2px solid var(--line);border-radius:999px;min-width:44px;height:44px;padding:0 14px;cursor:pointer}
button:focus-visible{outline:3px solid #ff5fa2}
#top{position:fixed;left:64px;right:64px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;text-align:center}
#ttl{margin:0;font-size:26px;font-weight:600;text-shadow:0 0 8px #fff,0 0 3px #fff}
#hint{font-size:14px;background:var(--pill);padding:3px 12px;border-radius:14px}
#back{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:26px;display:none}
#kits{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:none;justify-content:center;gap:12px}
#kits button{width:48px;padding:0;border:3px solid #fff}
#kits button.on{border-color:var(--ink)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;align-items:center}
#bpm{min-width:34px;text-align:center}
#met.on{background:#ff5fa2;color:#fff}

<div id="top"><h1 id="ttl">Studio</h1><div id="hint"></div></div>
<button id="back" aria-label="Retour dans la pièce">‹</button>
<div id="kits"></div>
<div id="bar"><button id="m1" aria-label="Ralentir">−</button><b id="bpm">90</b><button id="m2" aria-label="Accélérer">+</button><button id="met">♩ Métronome</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),PI=Math.PI;
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const cv=R.domElement,scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,60);
scene.add(new T.HemisphereLight(0xffffff,0xffc2e0,1.05));
const sun=new T.DirectionalLight(0xffffff,.7);sun.position.set(3,8,4);scene.add(sun);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<.8?75:60;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* helpers */
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.55});
function mk(g,c,p,par,r){const m=new T.Mesh(g,M(c));if(p)m.position.set(...p);if(r)m.rotation.set(...r);par.add(m);return m}
const Bx=(w,h,d,c,p,par,r)=>mk(new T.BoxGeometry(w,h,d),c,p,par,r);
const Cy=(a,b,h,c,p,par,r)=>mk(new T.CylinderGeometry(a,b,h,32),c,p,par,r);
const Sp=(r,c,p,par,x=1,y=1,z=1)=>{const m=mk(new T.SphereGeometry(r,20,14),c,p,par);m.scale.set(x,y,z);return m};
const Tr=(r,t,c,p,par,rot)=>mk(new T.TorusGeometry(r,t,10,32),c,p,par,rot);

/* pièce chromatique : les couleurs glissent selon ta position */
const U={uT:{value:0},uC:{value:new T.Vector3()}};
const room=new T.Mesh(new T.BoxGeometry(16,9,22),new T.ShaderMaterial({uniforms:U,side:T.BackSide,
vertexShader:'varying vec3 p;void main(){p=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}',
fragmentShader:'varying vec3 p;uniform float uT;uniform vec3 uC;void main(){float w=sin(p.y*.5+p.x*.3+uT*.25)*.05+sin(p.z*.4-uT*.2+p.x*.2)*.05;float ph=p.y*.012+p.x*.01+p.z*.01+uC.x*.015+uC.z*.012+uT*.008+w;vec3 c=.64+.36*cos(6.283*(vec3(0.,.33,.67)+ph));float gr=smoothstep(.2,1.,sin(p.y*.3+p.x*.2+uT*.2)*.5+.5);c=mix(c,vec3(.35,.98,.55),gr*.25);c+=.04*sin(p.y*.8+uT*.3);gl_FragColor=vec4(c,1.);}'}));
room.position.set(0,4.49,-1);scene.add(room);
const fc=document.createElement('canvas');fc.width=fc.height=64;const fx=fc.getContext('2d');fx.fillStyle='#ffd9ec';fx.fillRect(0,0,64,64);fx.fillStyle='#fff7c9';fx.fillRect(0,0,32,32);fx.fillRect(32,32,32,32);
const fT=new T.CanvasTexture(fc);fT.wrapS=fT.wrapT=T.RepeatWrapping;fT.repeat.set(8,11);fT.magFilter=T.NearestFilter;
const fl=new T.Mesh(new T.PlaneGeometry(16,22),new T.ShaderMaterial({uniforms:U,vertexShader:'varying vec3 p;void main(){p=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}',
fragmentShader:'varying vec3 p;uniform float uT;void main(){vec3 v=normalize(cameraPosition-p);float f=1.-abs(v.y);float ph=p.x*.045-p.z*.04+f*.5+uT*.012+.45;vec3 c=.66+.34*cos(6.283*(vec3(0.,.33,.67)+ph));c=mix(c,vec3(.82,.84,.9),.25);c+=.1*pow(f,3.);gl_FragColor=vec4(c,1.);}'}));fl.rotation.x=-PI/2;fl.position.set(0,.01,-1);scene.add(fl);
const ball=new T.Group();ball.position.set(0,6.3,-1);scene.add(ball);
const core=mk(new T.SphereGeometry(2,32,24),'#8f95c4',null,ball);core.material.metalness=.6;core.material.roughness=.3;
const NF=240,NR=[],GS=[new T.OctahedronGeometry(.2),new T.SphereGeometry(.17,10,6),new T.TorusGeometry(.11,.05,6,12)],IM=GS.map((g,k)=>{const m=new T.InstancedMesh(g,new T.MeshStandardMaterial({metalness:.8,roughness:.15,emissive:'#443366'}),NF/3);ball.add(m);return m});
{const d=new T.Object3D(),cn=[0,0,0];for(let i=0;i<NF;i++){const y=1-2*(i+.5)/NF,r=Math.sqrt(1-y*y),th=i*2.39996,n=new T.Vector3(Math.cos(th)*r,y,Math.sin(th)*r);NR.push(n);const k=i%3,id=cn[k]++;
d.position.copy(n).multiplyScalar(2.05);d.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),n);d.scale.set(1,k==1?1:1,k==1?.4:1);d.updateMatrix();IM[k].setMatrixAt(id,d.matrix);IM[k].setColorAt(id,new T.Color().setHSL((i*.037)%1,.6,.8))}}
const spots=[];for(let i=0;i<NF;i+=4){const m=new T.Mesh(i%8?new T.CircleGeometry(.28,24):new T.CircleGeometry(.36,4),new T.MeshBasicMaterial({color:new T.Color().setHSL(Math.random(),.7,.7),transparent:true,opacity:.5,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));m.userData.n=NR[i];scene.add(m);spots.push(m)}
const Yax=new T.Vector3(0,1,0);
function ballTick(t){ball.rotation.y=t*.15;const c=ball.position;spots.forEach(m=>{const d=m.userData.n.clone().applyAxisAngle(Yax,ball.rotation.y);let b=1e9,w=null;
[[0,8,-8],[1,9,0],[2,10,-12]].forEach(([a,hi,lo])=>{const dv=d.getComponent(a),cv=c.getComponent(a);if(Math.abs(dv)<1e-3)return;const tt=((dv>0?hi:lo)-cv)/dv;if(tt>0&&tt<b){b=tt;w=[a,dv>0?-1:1]}});
if(!w){m.visible=false;return}m.visible=true;m.position.copy(c).addScaledVector(d,b);const nr=new T.Vector3();nr.setComponent(w[0],w[1]);m.position.addScaledVector(nr,.03);m.lookAt(m.position.clone().add(nr))})}

/* audio */
let AC,out,dub,an,gb,rv,dl2,fd=new Uint8Array(128);
function au(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.connect(AC.destination);out=AC.createGain();out.gain.value=.8;out.connect(c);
an=AC.createAnalyser();an.fftSize=256;out.connect(an);dub=AC.createGain();const d=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();d.delayTime.value=.375;fb.gain.value=.5;lp.frequency.value=1800;dub.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(out);
rv=AC.createGain();const cv2=AC.createConvolver(),N2=AC.sampleRate*2.6|0,ib=AC.createBuffer(2,N2,AC.sampleRate);for(let c=0;c<2;c++){const a=ib.getChannelData(c);for(let i=0;i<N2;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/N2,2.5)}cv2.buffer=ib;rv.connect(cv2);cv2.connect(out);
dl2=AC.createGain();const d2=AC.createDelay(1),f2=AC.createGain();d2.delayTime.value=.36;f2.gain.value=.45;dl2.connect(d2);d2.connect(f2);f2.connect(d2);d2.connect(out);
gb=AC.createGain();const ch=AC.createDelay(.1),lf=AC.createOscillator(),lg=AC.createGain(),gs=AC.createGain();ch.delayTime.value=.022;lf.frequency.value=.6;lg.gain.value=.006;lf.connect(lg);lg.connect(ch.delayTime);lf.start();gb.connect(out);gb.connect(ch);ch.connect(out);gs.gain.value=.4;gb.connect(gs);gs.connect(dub)}
if(AC.state!=='running')AC.resume()}
function tone(f,type='sine',d=.4,v=.3,o={}){au();const t=AC.currentTime,os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);if(o.det)os.detune.value=o.det;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
let n=os;if(o.lp){const l=AC.createBiquadFilter();l.frequency.value=o.lp;os.connect(l);n=l}n.connect(g);g.connect(out);if(o.dub)g.connect(dub);os.start(t);os.stop(t+d+.05)}
function noise(d=.2,fr=3000,v=.3,type='highpass',q=1){au();const t=AC.currentTime,n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fr;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(out);s.start(t)}
const seq=(a,ms)=>a.forEach((f,i)=>setTimeout(f,i*ms));

/* instruments */
const I=[],bq=new Set();
function bump(m){const u=m.userData;if(!(u.t>.02))u.s0=m.scale.clone();u.t=1;bq.add(m)}
function inst(name,col,w,[x,y,z,r],v,hint,build){const g=new T.Group();g.position.set(x,y,z);g.rotation.y=r;scene.add(g);if(y)Bx(3.6,.14,3.6,'#ff9ed0',[0,-.07,0],g);
const o={name,g,w,v,hint,keys:[]};I.push(o);build(o,g);
if(!y){g.position.set(0,0,0);g.rotation.y=0;g.updateMatrixWorld(true);const bb=new T.Box3().setFromObject(g);g.position.set(x,0,z);g.rotation.y=r;g.updateMatrixWorld(true);
if(bb.min.y>.12){const cx=(bb.max.x+bb.min.x)/2,cz=(bb.max.z+bb.min.z)/2,hx=(bb.max.x-bb.min.x)/2-.3,hz=(bb.max.z-bb.min.z)/2-.3,cc=`hsl(${I.length*47},85%,60%)`;[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b])=>Cy(.08,.14,bb.min.y,cc,[cx+a*hx,bb.min.y/2,cz+b*hz],g))}}
g.traverse(m=>{if(m.isMesh)m.userData.o=o});return o}
const key=(o,m,fn)=>{m.userData.fn=fn;o.keys.push(m);return m};
const L=Math.PI/2,TAP='Touche l’instrument pour jouer';

/* Batterie : 4 kits très différents */
const KITS=[{n:'Rock',c:'#d63a2f',w:'#f4f1e8',cy:'#ffd23f',s:{xz:1,y:1,k:1.15,c:1,cy:1}},
{n:'Jazz',c:'#c9965a',w:'#f3e3c3',cy:'#e8c36a',s:{xz:.8,y:.9,k:.8,c:1.3,cy:.5}},
{n:'Électro',c:'#2a64d4',w:'#6ff0ff',cy:'#ff3df0',s:{xz:1,y:.3,k:1,c:.55,cy:1},e:1},
{n:'Bonbon',c:'#ff5fa2',w:'#fff0fa',cy:'#9cff6a',s:{xz:1.1,y:1.8,k:.9,c:.7,cy:1}}];
const DR=[
{k:()=>tone(120,'sine',.4,.95,{f2:42}),s:()=>{noise(.22,1500,.55);tone(190,'triangle',.14,.4,{f2:130})},h:()=>noise(.07,7500,.3),c:()=>noise(1.1,4500,.4),t:m=>tone(125*m,'sine',.45,.6,{f2:70*m})},
{k:()=>tone(85,'sine',.25,.7,{f2:55}),s:()=>noise(.3,2500,.25,'bandpass',.7),h:()=>noise(.09,9000,.18,'bandpass',2),c:()=>[1,2.76,5.4].forEach((m,i)=>tone(420*m,'sine',2,.12/(i+1),{a:.002})),t:m=>tone(190*m,'sine',.35,.45,{f2:150*m})},
{k:()=>tone(60,'sine',.9,1,{f2:38}),s:()=>[0,15,30].forEach(d=>setTimeout(()=>noise(.12,1200,.4,'bandpass',1.5),d)),h:()=>noise(.04,12000,.25),c:()=>noise(.5,9000,.3),t:m=>tone(200*m,'sine',.7,.6,{f2:70*m})},
{k:()=>tone(320,'triangle',.3,.8,{f2:70}),s:()=>tone(900,'sine',.12,.5,{f2:250}),h:()=>tone(4000,'sine',.05,.25),c:()=>[1,2.4,3.9].forEach((m,i)=>tone(900*m,'sine',1.2,.15/(i+1),{a:.002})),t:m=>tone(520*m,'sine',.3,.5,{f2:700*m})}];
let kit=0;const P={cy:[]},DM=[];
const dr=r=>{const d=DR[kit];r=='k'?d.k():r=='s'?d.s():r=='h'?d.h():r=='c'?d.c():d.t(r)};
inst('Batterie','#ffc2e0',2.9,[-5.4,0,7.4,Math.atan2(5.4,-7.4)],[0,1.7,3.8,0,.85,0],'Touche les fûts · 4 kits en bas',(o,g)=>{g.scale.setScalar(1.3);
const D=(r,h,p,rot,role,fn)=>{const s=Cy(r,r,h,'#fff',p,g,rot),d=Cy(r*.88,r*.88,h*1.04,'#fff',p,g,rot);[s,d].forEach(m=>{m.material.roughness=.25;m.material.metalness=.35});DM.push({a:[s,d],r:role});key(o,s,fn);key(o,d,fn)};
const Y=(x,y,z,fn,rr=.4)=>{Cy(.025,.025,y,'#c9ccd6',[x,y/2,z],g);const c=Cy(rr,rr,.04,'#fff',[x,y,z],g,[.12,0,0]);c.material.metalness=.7;c.material.roughness=.25;P.cy.push(c);key(o,c,fn)};
D(.72,.72,[0,.74,0],[L,0,0],'k',()=>dr('k'));[-1,1].forEach(a=>Cy(.03,.03,.5,'#c9ccd6',[a*.6,.2,.6],g,[.5,0,a*.4]));
Cy(.03,.03,.7,'#c9ccd6',[-1,.35,.6],g);D(.44,.28,[-1,.95,.6],[.1,0,0],'s',()=>dr('s'));
D(.36,.34,[-.45,1.6,.05],[.25,0,0],'t',()=>dr(1.3));D(.36,.34,[.45,1.6,.05],[.25,0,0],'t',()=>dr(1.1));
D(.5,.62,[1.3,.85,.5],[.1,0,0],'t',()=>dr(.75));[0,2,4].forEach(i=>Cy(.03,.03,.5,'#c9ccd6',[1.3+Math.sin(i)*.4,.25,.5+Math.cos(i)*.4],g));
Y(-1.8,1.25,.2,()=>dr('h'),.3);Y(1.9,2.1,-.3,()=>dr('c'));Y(-1.4,2.1,-.6,()=>dr('c'));Y(.7,1.95,-.9,()=>dr('c'),.5)});
const kb=$('kits');KITS.forEach((k,i)=>{const b=document.createElement('button');b.style.background=k.c;b.setAttribute('aria-label','Kit '+k.n);b.onclick=()=>{au();setKit(i);dr('k');$('hint').textContent='Kit '+k.n}});
KITS.forEach((k,i)=>{const b=kb.children[i]||document.createElement('button');b.style.background=k.c;b.setAttribute('aria-label','Kit '+k.n);b.onclick=()=>{au();setKit(i);dr('k');$('hint').textContent='Kit '+k.n};if(!b.parentNode)kb.append(b)});
function setKit(i){kit=i;const k=KITS[i],s=k.s;DM.forEach(({a,r})=>a.forEach((m,j)=>{const q=r=='k'?s.k:1;m.scale.set(s.xz*q,s.y,s.xz*q);m.userData.t=0;m.material.color.set(j?k.w:k.c);m.material.emissive.set(k.e&&j?k.w:'#000');m.material.emissiveIntensity=.5}));
P.cy.forEach(c=>{c.scale.set(s.c,s.cy,s.c);c.material.color.set(k.cy);c.material.emissive.set(k.e?k.cy:'#000');c.material.emissiveIntensity=.5});[...kb.children].forEach((b,j)=>b.classList.toggle('on',j==i))}
setKit(0);

/* Juno : octave, sustain, reverb, delay, filtre */
const lab=(g,t,x,z,w=.8,y=1.012)=>{const c=document.createElement('canvas');c.width=256;c.height=96;const q=c.getContext('2d'),tx=new T.CanvasTexture(c),d=a=>{q.clearRect(0,0,256,96);q.fillStyle='#2d2342';q.font='bold 46px Fredoka,sans-serif';q.textAlign='center';q.fillText(a,128,64);tx.needsUpdate=true};d(t);const m=new T.Mesh(new T.PlaneGeometry(w,w*.375),new T.MeshBasicMaterial({map:tx,transparent:true}));m.rotation.x=-L;m.position.set(x,y,z);g.add(m);return d};
const J={sus:.4,rev:.35,del:.25,cut:.7,oct:0,wave:0,arp:0},WV=['sawtooth','square','triangle'],WN=['SCIE','CARRÉ','TRI'];
function jv(f){au();const t=AC.currentTime,os=[-8,8].map(d=>{const q=AC.createOscillator();q.type=WV[J.wave];q.frequency.value=f*Math.pow(2,J.oct);q.detune.value=d;q.start();return q}),lp=AC.createBiquadFilter(),gn=AC.createGain(),sr=AC.createGain(),sd=AC.createGain();
lp.frequency.value=300+J.cut*5000;os.forEach(q=>q.connect(lp));lp.connect(gn);gn.connect(out);gn.connect(sr);gn.connect(sd);sr.gain.value=J.rev*1.4;sd.gain.value=J.del;sr.connect(rv);sd.connect(dl2);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.15,t+.02);
return{end:()=>{const n=AC.currentTime,r=.1+J.sus*3;gn.gain.cancelScheduledValues(n);gn.gain.setValueAtTime(gn.gain.value,n);gn.gain.linearRampToValueAtTime(0,n+r);os.forEach(q=>q.stop(n+r+.05))}}}
function jplay(f){if(!J.arp)return jv(f);let i=0;const A=[0,4,7,12],tm=setInterval(()=>{const v=jv(f*Math.pow(2,A[i++%4]/12));setTimeout(v.end,90)},130);return{end:()=>clearInterval(tm)}}
inst('Juno','#d8d8e8',1.9,[-6.2,0,.8,L],[0,3,1.5,0,.8,.1],'Faders : sustain, reverb, delay, filtre · boutons : octave, onde, arpège',(o,g)=>{
Bx(3.5,.4,1.5,'#2b2f3a',[0,.5,0],g);Bx(3.5,.12,.6,'#2b2f3a',[0,.74,-.5],g);
[['SUSTAIN','sus'],['REVERB','rev'],['DELAY','del'],['FILTRE','cut']].forEach(([n,k],i)=>{const x=-1.4+i*.45;Bx(.1,.03,.5,'#0e0f14',[x,.81,-.55],g);lab(g,n,x,-.2,.45,.806);
const kn=Bx(.22,.1,.12,'#ffd23f',[x,.86,-.8+J[k]*.5],g),tr=Bx(.3,.05,.6,'#ffd23f',[x,.8,-.55],g);tr.material.transparent=true;tr.material.opacity=0;
const set=h=>{const l=g.worldToLocal(h.point.clone()).z,v=Math.max(0,Math.min(1,(l+.8)/.5));J[k]=v;kn.position.z=-.8+v*.5};key(o,tr,h=>{set(h);return{move:set}})});
const bl={};[['OCT−',()=>{J.oct=Math.max(-2,J.oct-1);bl.o('OCT '+J.oct)},'#ff4d6d'],['OCT+',()=>{J.oct=Math.min(2,J.oct+1);bl.o('OCT '+J.oct)},'#3ddc84'],['ONDE',()=>{J.wave=(J.wave+1)%3;bl.w(WN[J.wave])},'#3db8ff'],['ARP',()=>{J.arp^=1;bl.a(J.arp?'ARP ON':'ARP')},'#a58bff']].forEach(([n,fn,c],i)=>{const x=.5+i*.4,b=Cy(.13,.13,.1,c,[x,.85,-.58],g),d=lab(g,n,x,-.2,.45,.806);if(i==0)bl.o=d;if(i==1)bl.o=bl.o;if(i==2)bl.w=d;if(i==3)bl.a=d;key(o,b,()=>{fn()})});

[[3.6,1.9,2,.6,'l'],[2.8,1.6,2,.46,'l'],[2,1.3,1,.5,'m'],[1.2,1,1,.3,'h']].forEach(([w,h,n,r,t])=>{const a=w/2,b=h/2,yc=y+b*.92,e=Sp(1,col,[0,yc,0],g,a,b,1.05);e.material.roughness=.35;
for(let i=0;i<n;i++){const wx=(i-(n-1)/2)*(a*.95),zz=1.05*Math.sqrt(Math.max(.25,1-(wx/a)**2));Tr(r,.08,'#fff',[wx,yc,zz-.03],g);const gl=Tr(r*.8,.03,'#fff',[wx,yc,zz],g);gl.material.emissive.set('#ff6fae');
Cy(r,r,.06,'#2d2342',[wx,yc,zz-.02],g,[L,0,0]);const cn=Cy(r*.55,r*.55,.22,'#fff7d6',[wx,yc,zz+.04],g,[L,0,0]);Sp(r*.18,col,[wx,yc,zz+.16],g);spk.push({c:cn,z:zz+.04,t,gl})}y+=h*.82});
Sp(.4,'#fff',[0,y+.35,0],g,1,1.3,1);tw.push({g,x})}
tower(-6,'#ff2e93');tower(-2.3,'#ffd400');tower(2.3,'#00d26a');tower(6,'#00b0ff');
const sunb=Cy(3.4,3.4,.1,'#ffd23f',[0,4.2,-11.8],scene,[L,0,0]);Tr(3.4,.15,'#ff6fae',[0,4.2,-11.75],scene);
for(let i=0;i<16;i++){const x=-7+i*14/15,m=mk(new T.ConeGeometry(.25,.5,3),['#ff4d6d','#ffd23f','#3ddc84','#ff9ec7'][i%4],[x,7.6-.6*(1-(x/7)**2),-9.2],scene,[PI,0,0])}

/* Dub Siren centrale + drums de dub */
let orb,dm=null,pn=0,st=0;const PN=['ONE DROP','STEPPERS','ROCKERS','DUB BREAK'],PT=[{k:[8],s:[8],h:[0,2,4,6,8,10,12,14],c:[4,12]},{k:[0,4,8,12],s:[8],h:[2,6,10,14],c:[4,12]},{k:[0,3,8,11],s:[4,12],h:[0,2,4,6,8,10,12,14],c:[4,12]},{k:[0,10],s:[8,14],h:[3,7,11,15],c:[6,14]}];
const dstep=()=>{const p=PT[pn],i=st++%16;if(p.k.includes(i))tone(62,'sine',.35,.9,{f2:38});if(p.s.includes(i)){noise(.12,2000,.3,'bandpass',2);tone(220,'triangle',.12,.35,{f2:150,dub:1})}if(p.h.includes(i))noise(.04,9000,.12);if(p.c.includes(i))[262,330,392].forEach(f=>tone(f,'square',.09,.07,{lp:1800,dub:1}))};
inst('Dub Siren','#ffd23f',1.9,[0,0,-2.5,0],[0,2.8,2.6,0,1,0],'Maintiens un bouton · DRUMS lance le rythme, PATTERN le change',(o,g)=>{
Bx(3.8,.9,1.9,'#2d2342',[0,.45,0],g);Bx(3.6,.1,1.7,'#ffe9a8',[0,.95,0],g);Cy(.06,.06,1,'#ffd23f',[0,1.5,-.6],g);
orb=Sp(.38,'#ffffff',[0,2.2,-.6],g);orb.material.emissive.set('#a58bff');
const sw=()=>{au();const t=AC.currentTime,os=AC.createOscillator(),gn=AC.createGain(),l=AC.createBiquadFilter();os.type='sawtooth';l.frequency.value=2600;os.frequency.setValueAtTime(300,t);os.frequency.exponentialRampToValueAtTime(1500,t+1.2);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.22,t+.05);os.connect(l);l.connect(gn);gn.connect(out);gn.connect(dub);os.start();
return{end:()=>{const n=AC.currentTime;os.frequency.cancelScheduledValues(n);os.frequency.setValueAtTime(os.frequency.value,n);os.frequency.exponentialRampToValueAtTime(110,n+1.4);gn.gain.cancelScheduledValues(n);gn.gain.setValueAtTime(gn.gain.value,n);gn.gain.linearRampToValueAtTime(0,n+1.4);os.stop(n+1.5)}}};
const labs=[],BT=[['SIRÈNE',sw,(x,z)=>Sp(.3,'#ff4d6d',[x,1,z],g,1,.6,1)],
['LASER',()=>tone(3000,'square',.4,.18,{f2:180,lp:5000,dub:1}),(x,z)=>Cy(.14,.28,.45,'#3db8ff',[x,1.2,z],g)],
['POLICE',()=>seq([0,1,2,3,4,5].map(i=>()=>tone(i%2?650:880,'square',.14,.18,{lp:3000,dub:1})),160),(x,z)=>Cy(.28,.28,.2,'#ffd23f',[x,1.1,z],g)],
['CORNE',()=>[440,554,659].forEach(f=>tone(f,'sawtooth',.9,.12,{lp:2200,a:.02,dub:1})),(x,z)=>mk(new T.ConeGeometry(.28,.5,16),'#a58bff',[x,1.25,z],g)],
['SUB',()=>tone(70,'sine',1.2,1,{f2:28}),(x,z)=>{Tr(.3,.04,'#fff',[x,1.07,z],g,[L,0,0]);return Cy(.34,.34,.14,'#222',[x,1.06,z],g)}],
['BIP',()=>seq([1200,900,600].map(f=>()=>tone(f,'triangle',.12,.25,{dub:1})),90),(x,z)=>Bx(.45,.3,.45,'#ff9a5c',[x,1.15,z],g)],
['DRUMS',()=>{au();if(dm){clearInterval(dm);dm=null}else{st=0;dm=setInterval(dstep,60000/bpm/4)}},(x,z)=>Sp(.32,'#00e676',[x,1,z],g,1,.7,1)],
['PATTERN',()=>{pn=(pn+1)%4;labs[7](PN[pn])},(x,z)=>mk(new T.CylinderGeometry(.3,.3,.16,6),'#00e5ff',[x,1.07,z],g)]];
BT.forEach(([t,fn,mkb],i)=>{const x=-1.35+(i%4)*.9,z=i<4?-.3:.38,m=mkb(x,z);labs[i]=lab(g,i==7?PN[0]:t,x,z+.38,.85);key(o,m,()=>{const r=fn();if(i==6)m.material.emissive.set(dm?'#00e676':'#000');return r})})});
const rings=[0,1,2].map(()=>{const r=Tr(.5,.02,'#fff',[0,2.2,-3.05],scene,[L,0,0]);r.material.transparent=true;r.visible=false;r.userData.s=0;return r});let cd=0;
fxs=(t,lo,mi)=>{bubTick(t);orb.material.emissive.setHSL((t*.05+mi)%1,.7,.55);const sc=1+lo*.6;orb.scale.set(sc,sc,sc);
if(--cd<0&&lo>.3){const r=rings.find(r=>!r.visible);if(r){r.visible=true;r.userData.s=1;r.material.color.setHSL(Math.random(),.6,.7);cd=12}}
rings.forEach(r=>{if(r.visible){const q=r.userData.s+=.06;r.scale.set(q,q,q);r.material.opacity=Math.max(0,1-(q-1)/3);if(q>4)r.visible=false}});
spk.forEach(s=>{s.gl.material.emissiveIntensity=.3+(s.t=='l'?lo:mi)*2.5});mane.forEach((m,i)=>m.material.emissive.setHSL((t*.1+i/6)%1,.6,.45));
mal.visible=!!foc&&foc.name=='Bols';mal.t*=.95;mal.position.set(rest.x,rest.y+.08+(mal.t>.8?(mal.t-.8)*3:0),rest.z)};

/* contrôles : 1 doigt = regarder / toucher, 2 doigts = marcher */
let yaw=PI,pit=0,px=0,pz=6,foc=null,moved=0,tapOK=true,drag=null;const pts=new Map(),ky={};
const cp=new T.Vector3(0,1.7,6),ct=new T.Vector3(0,1.7,5),gP=cp.clone(),gT=ct.clone(),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const WALK='Glisse : regarder · 2 doigts : marcher · tape un instrument';
function ui(){const f=!!foc;$('back').style.display=f?'block':'none';$('ttl').textContent=f?foc.name:'Studio';$('hint').style.display='';$('hint').textContent=f?foc.hint:WALK;$('kits').style.display=f&&foc.name=='Batterie'?'flex':'none'}
function walk(fw,st){px+=Math.sin(yaw)*fw-Math.cos(yaw)*st;pz+=Math.cos(yaw)*fw+Math.sin(yaw)*st;px=cl(px,-4.2,4.2);pz=cl(pz,-5.6,9)}
function focus(o){au();foc=o;o.g.updateMatrixWorld(true);const c=new T.Vector3(...o.v.slice(0,3)),t=new T.Vector3(...o.v.slice(3)),off=c.clone().sub(t),k=Math.max(.75,o.w/(Math.tan(cam.fov*PI/360)*cam.aspect)/off.length());
gP.copy(o.g.localToWorld(t.clone().add(off.multiplyScalar(k))));gT.copy(o.g.localToWorld(t));ui()}
const out2=()=>{foc=null;ui()};$('back').onclick=out2;addEventListener('keydown',e=>{ky[e.key.toLowerCase()]=1;if(e.key=='Escape')out2()});addEventListener('keyup',e=>ky[e.key.toLowerCase()]=0);
addEventListener('wheel',e=>{if(!foc)walk(-e.deltaY*.004,0)});
const ray=new T.Raycaster(),pt=new T.Vector2();
function pick(e,l,rec){pt.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pt,cam);return ray.intersectObjects(l,rec)[0]}
cv.onpointerdown=e=>{au();$('hint').style.display='none';cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size==1){moved=0;tapOK=true}else tapOK=false;
if(foc&&!drag){const h=pick(e,foc.keys);if(h){drag=h.object.userData.fn(h)||{};bump(h.object)}}};
cv.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(drag){const h=pick(e,foc.keys);if(h&&drag.move)drag.move(h);return}if(foc)return;moved+=Math.abs(dx)+Math.abs(dy);
if(pts.size>=2)walk(dy*.011,-dx*.011);else{yaw-=dx*.005;pit=cl(pit-dy*.005,-1.1,1.1)}};
cv.onpointerup=cv.onpointercancel=e=>{if(drag&&pts.size<=1){drag.end&&drag.end();drag=null}
else if(!foc&&pts.size==1&&tapOK&&moved<8){const h=pick(e,I.map(o=>o.g),true);if(h&&h.object.userData.o)focus(h.object.userData.o)}pts.delete(e.pointerId)};

/* métronome */
let bpm=90,mt=null;const mset=()=>{$('bpm').textContent=bpm;if(mt){clearInterval(mt);mt=setInterval(()=>tone(1000,'square',.04,.1),60000/bpm)}};
$('m1').onclick=()=>{bpm=Math.max(40,bpm-5);mset()};$('m2').onclick=()=>{bpm=Math.min(220,bpm+5);mset()};
$('met').onclick=()=>{au();if(mt){clearInterval(mt);mt=null}else mt=setInterval(()=>tone(1000,'square',.04,.1),60000/bpm);$('met').classList.toggle('on',!!mt)};

/* boucle */
const av=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=fd[i];return s/(b-a)/255};
function loop(t){requestAnimationFrame(loop);t*=.001;
if(ky.w||ky.arrowup)walk(.06,0);if(ky.s||ky.arrowdown)walk(-.06,0);if(ky.a||ky.arrowleft)walk(0,-.06);if(ky.d||ky.arrowright)walk(0,.06);
if(!foc){gP.set(px,1.7,pz);gT.set(px+Math.cos(pit)*Math.sin(yaw),1.7+Math.sin(pit),pz+Math.cos(pit)*Math.cos(yaw))}
const k=foc?.08:.3;cp.lerp(gP,k);ct.lerp(gT,k);cam.position.copy(cp);cam.lookAt(ct);U.uT.value=t;U.uC.value.copy(cp);
let lo=0,mi=0;if(an){an.getByteFrequencyData(fd);lo=av(0,4);mi=av(5,16)}
spk.forEach(s=>{const v=s.t=='l'?lo:mi;s.c.position.z=s.z+v*.35;s.c.scale.x=s.c.scale.z=1+v*.2});
tw.forEach(s=>s.g.position.x=s.x+(Math.random()-.5)*lo*.08);sunb.scale.setScalar(1+lo*.06);
fxs(t,lo,mi);I.forEach(o=>{if(o.ring)o.ring.rotation.y+=.004});ballTick(t);
bq.forEach(m=>{const u=m.userData;u.t*=.86;m.scale.copy(u.s0).multiplyScalar(1-.12*u.t);if(u.t<.02){m.scale.copy(u.s0);bq.delete(m)}});
R.render(scene,cam)}
ui();requestAnimationFrame(loop);
</script></body></html>
